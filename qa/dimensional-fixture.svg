<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="80mm" viewBox="0 0 100 80">
<title>Independent dimension fixture — Main panel — Rev A</title>
<desc>INTERFACEBENCH 1.3.0-rc.1; front fabrication view; +X right, +Y down; top-left origin; fit allowance per side 0 mm; text outlined in DejaVu Sans. Nominal geometry unless explicit allowance shown.</desc>
<g transform="translate(0 0)"><g id="outline" data-process="Panel outline"><rect x="0" y="0" width="100" height="80" rx="0" transform="translate(0 0) rotate(0)" fill="none" stroke="#000000" stroke-width="0.15"/></g>
<g id="cut" data-process="Cutouts &amp; drilling"><circle cx="0" cy="0" r="5" transform="translate(25 30) rotate(0)" fill="none" stroke="#000000" stroke-width="0.15"/></g>
<g id="engrave" data-process="Engraving"></g>
<g id="uv" data-process="UV-print artwork"></g>
<g id="overlay" data-process="Adhesive overlay"></g>
<g id="registration" data-process="Registration"></g>
<g id="reference" data-process="Reference geometry"></g></g>
</svg>