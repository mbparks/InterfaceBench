<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15261f"><meta name="description" content="Give your contraption a face. A local-first physical interface design instrument."><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'"><title>INTERFACEBENCH — Give your contraption a face.</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><script defer src="./vendor/opentype.min.js"></script><script defer src="./vendor/pdf-lib.min.js"></script><script defer src="./vendor/jszip.min.js"></script><script type="module" src="./js/app.js"></script></head>
<body><div id="boot" role="status">Opening the workbench…</div><div id="app" hidden>
<header class="appbar"><button class="brand" data-action="home" title="Projects and examples"><span class="mark">i<span>b</span></span><span><strong>INTERFACEBENCH</strong><small>GIVE YOUR CONTRAPTION A FACE.</small></span></button><div class="project-title"><span id="projectName"></span><span id="revision" class="pill"></span></div><span id="saveState" class="save" role="status">○ Unsaved</span><button data-action="backup" title="Download a portable project JSON">Backup ↓</button><button data-action="commands" title="Command menu (Ctrl or Command K)">⌘ <span class="hide-small">Commands</span></button></header>
<nav class="workflow" aria-label="Design workflow"><div id="stages"></div><div class="bar-tools"><button data-action="undo" title="Undo (Ctrl Z)" id="undo">↶</button><button data-action="redo" title="Redo (Ctrl Shift Z)" id="redo">↷</button><select id="mode" aria-label="Detail mode"><option value="easy">Easy</option><option value="advanced">Advanced</option></select><select id="theme" aria-label="Color theme"><option value="dark">Dark</option><option value="light">Light</option><option value="contrast">High contrast</option></select><button data-action="help" title="Help & shortcuts">?</button></div></nav>
<div id="walkthrough" hidden></div>
<main class="workspace"><aside class="browser" id="browser"><div class="aside-title"><span>PROJECT & PARTS</span><button data-action="collapse-left" title="Collapse browser">‹</button></div><div id="leftContent"></div></aside><div class="splitter left-split" role="separator" aria-label="Resize project browser" tabindex="0" aria-orientation="vertical"></div>
<section class="workarea"><div class="canvasbar"><div class="segmented"><button data-action="front" id="front">Front</button><button data-action="rear" id="rear">Rear</button></div><div class="label-switches" role="group" aria-label="Component labels for this panel"><span>Labels</span><label><input type="checkbox" id="labels-front" data-label-scope="panel" data-label-side="front" aria-label="Show front component labels"> Front</label><label><input type="checkbox" id="labels-rear" data-label-scope="panel" data-label-side="rear" aria-label="Show rear component labels and references"> Rear</label></div><div class="canvas-tools"><button data-action="select-tool" id="selectTool" title="Select and drag (V)">↖ <span>Select</span></button><button data-action="pan-tool" id="panTool" title="Pan canvas (H or hold Space)">✥ <span>Pan</span></button><button data-action="measure" id="measureTool" title="Measure two points (M)">↔ <span>Measure</span></button></div><div class="canvas-tools end"><button data-action="fit" title="Fit panel (F)">Fit panel</button><button data-action="fit-selection" title="Fit selected objects">Fit selection</button><button data-action="focus" title="Toggle canvas focus (Tab)">⛶</button></div></div>
<div class="canvas-wrap" id="canvasWrap"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Panel design canvas. Use the object list and inspector for keyboard editing." tabindex="0"></svg><div class="view-badge" id="viewBadge"></div><div class="canvas-hint" id="canvasHint"></div><button class="show-browser" data-action="collapse-left">Parts ›</button></div><div id="stageSurface" hidden></div><div class="statusbar"><span id="selectionStatus">No selection</span><span id="dimensions"></span><div><label><input id="snap" type="checkbox" checked> Snap</label><select id="units" aria-label="Display units"><option value="mm">mm</option><option value="in">in</option></select><button data-action="zoom-out" title="Zoom out">−</button><span id="zoomLabel">100%</span><button data-action="zoom-in" title="Zoom in">+</button></div></div></section>
<div class="splitter right-split" role="separator" aria-label="Resize inspector" tabindex="0" aria-orientation="vertical"></div><aside class="inspector" id="inspector"><div class="inspector-tabs"><button data-action="inspect-tab" id="inspectTab">Inspector</button><button data-action="checks-tab" id="checksTab">Checks <span id="checkCount"></span></button></div><div id="rightContent"></div></aside></main>
<footer><span>FIELD INSTRUMENTS <span class="muted">/</span> GREEN SHOE GARAGE</span><span id="environment"></span><span id="version"></span></footer></div>
<dialog id="dialog"><div id="dialogContent"></div></dialog><div id="toast" role="status" aria-live="polite"></div><input id="fileInput" type="file" hidden><div id="updateBanner" hidden><span>A new version is ready.</span><button data-action="update">Save & reload</button></div><noscript>This app requires JavaScript enabled. Project data stays in your browser.</noscript></body></html>
